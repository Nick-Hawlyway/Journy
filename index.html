<script type="module">
/* ============ CONFIG — every tunable value lives here ============ */
const CONFIG={
 owner:{name:"Nickolas Hawley",role:"Cybersecurity student and Python builder",
  bio:"Edit this bio in CONFIG.owner. I build practical tools and I'm studying cybersecurity.",
  github:"https://github.com/your-username",linkedin:"https://www.linkedin.com/in/your-username",email:"mailto:you@example.com"},
 world:{w:2400,h:1800,cell:40,seed:7},
 light:{radius:210,flicker:.07,darkness:.95},
 range:{base:240,step:70,cap:760},
 speed:150, interact:110,
 /* projects.json equivalent: replace with your repos */
 projects:[
  {id:"fuel",title:"Fuel Finder",description:"Desktop app that finds nearby fuel prices and highlights ethanol-free stations.",tech:["Python","Tkinter"],repoUrl:"https://github.com/your-username/fuel-finder",liveUrl:"",position:{x:1450,y:620},color:"#e0731e",status:"In progress"},
  {id:"p2",title:"Port Watch",description:"Placeholder: a small network scanner. Replace in CONFIG.projects.",tech:["Python","Security"],repoUrl:"https://github.com/your-username/port-watch",liveUrl:"",position:{x:1800,y:1150},color:"#4da3ff",status:"Idea"},
  {id:"p3",title:"Farm Ledger",description:"Placeholder: spreadsheet tooling for a family farm.",tech:["Excel","Python"],repoUrl:"https://github.com/your-username/farm-ledger",liveUrl:"",position:{x:950,y:1450},color:"#4dffb0",status:"Done"},
  {id:"p4",title:"Spanish Flashcards",description:"Placeholder: a flashcard trainer.",tech:["JavaScript"],repoUrl:"https://github.com/your-username/flashcards",liveUrl:"",position:{x:2000,y:420},color:"#b07cff",status:"Done"}]
};
/* Seasonal palettes: teal / navy / ochre / orange, after the faceted fox painting */
const PAL={
 spring:{ground:['#1d3b3f','#24484a','#2d4f3e','#1b2f3a'],foliage:['#2f7a6b','#3d8f7a','#5aa38a','#d98a9a']},
 summer:{ground:['#14303a','#1b3d45','#22453f','#17283a'],foliage:['#1f6f73','#2b8a86','#3f9d6a','#c9a23a']},
 autumn:{ground:['#2b2f3a','#3a3a35','#4a3a2a','#25303a'],foliage:['#c8571f','#e08a1e','#b32d1e','#d8b04a']},
 winter:{ground:['#1a2b3d','#223a50','#2c4a62','#16233a'],foliage:['#2e5f78','#4f7f98','#8fb0c4','#6f94a8']}};

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const safe=u=>{try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:''}catch{return''}};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const sh=(h,f)=>`rgb(${rgb(h).map(v=>Math.max(0,Math.min(255,v*f|0)))})`;
const cv=$('#c'),ctx=cv.getContext('2d');
/* P: filled polygon. Every sprite is built from these facets. */
function P(pts,f,g=ctx){g.beginPath();pts.forEach((p,i)=>g[i?'lineTo':'moveTo'](p[0],p[1]));g.closePath();g.fillStyle=f;g.fill();g.strokeStyle=f;g.lineWidth=.8;g.stroke()}
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col+a);g.addColorStop(1,col+'00');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}

/* ============ seasons and holidays ============ */
const qd=new URLSearchParams(location.search).get('date');
let today=new Date();
if(/^\d{4}-\d{2}-\d{2}$/.test(qd||'')){const[y,m,d]=qd.split('-').map(Number);today=new Date(y,m-1,d)} // ?date=YYYY-MM-DD preview
const mo=today.getMonth()+1;
const season=mo>=3&&mo<=5?'spring':mo>=6&&mo<=8?'summer':mo>=9&&mo<=11?'autumn':'winter';
const pal=PAL[season];
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;return new Date(y,Math.floor(t/31)-1,t%31+1)}
const nthDow=(y,m,dow,n)=>{const d=new Date(y,m,1);let c=0;for(;;){if(d.getDay()==dow&&++c==n)return d;d.setDate(d.getDate()+1)}};
const lastMon=y=>{const d=new Date(y,5,0);while(d.getDay()!=1)d.setDate(d.getDate()-1);return d};
const HOLIDAYS=[
 {n:"New Year's",f:y=>new Date(y,0,1),deco:'star',c:'#e0b84a'},{n:"Valentine's Day",f:y=>new Date(y,1,14),deco:'heart',c:'#c93a4a'},
 {n:"St. Patrick's Day",f:y=>new Date(y,2,17),deco:'clover',c:'#2f9a5a'},{n:'Easter',f:easter,deco:'egg',c:'#c78ad8'},
 {n:'Memorial Day',f:lastMon,deco:'flag',c:'#2a5fa8'},{n:'Independence Day',f:y=>new Date(y,6,4),deco:'flag',c:'#c93a2a'},
 {n:'Halloween',f:y=>new Date(y,9,31),deco:'pumpkin',c:'#e0731e'},{n:'Thanksgiving',f:y=>nthDow(y,10,4,4),deco:'pumpkin',c:'#b8571f'},
 {n:'Christmas',f:y=>new Date(y,11,25),deco:'gift',c:'#c93a3a'}];
let hol=null,best=1e9;
for(const h of HOLIDAYS)for(const yy of[today.getFullYear(),today.getFullYear()+1]){const df=Math.round((h.f(yy)-today)/864e5);if(df>=-2&&df<best){best=df;hol=h}}
if(best>30)hol=null; // only decorate within a month of the holiday

/* ============ world generation ============ */
const W=CONFIG.world,C=W.cell,GW=W.w/C|0,GH=W.h/C|0,blocked=new Uint8Array(GW*GH),rnd=rng(W.seed);
const spawn={x:520,y:950};
const burrows=[{id:'home',home:true,title:'Home Burrow',x:660,y:880,color:'#f2d48a'},...CONFIG.projects.map(p=>({...p,x:p.position.x,y:p.position.y}))];
const pond={x:1250,y:1280,rx:200,ry:120};
const isBlocked=(x,y)=>blocked[(y/C|0)*GW+(x/C|0)];
const far=(x,y,d)=>[spawn,...burrows].every(b=>Math.hypot(b.x-x,b.y-y)>d);
function block(x,y,r){const R=Math.ceil(r/C)+1;for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const cx=(x/C|0)+i,cy=(y/C|0)+j;if(cx<0||cy<0||cx>=GW||cy>=GH)continue;if(Math.hypot((cx+.5)*C-x,(cy+.5)*C-y)<r+C*.35)blocked[cy*GW+cx]=1}}
function scatter(n,fn){const a=[];let t=3000;while(a.length<n&&t--){const x=80+rnd()*(W.w-160),y=120+rnd()*(W.h-200);if(fn(x,y,a))a.push({x,y})}return a}
const apart=(a,x,y,d)=>a.every(o=>Math.hypot(o.x-x,o.y-y)>d);
burrows.forEach(b=>block(b.x,b.y,34));
for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)if(((i*C+C/2-pond.x)/pond.rx)**2+((j*C+C/2-pond.y)/pond.ry)**2<1.1)blocked[j*GW+i]=1;
const trees=scatter(115,(x,y,a)=>far(x,y,120)&&apart(a,x,y,85)&&((x-pond.x)/pond.rx)**2+((y-pond.y)/pond.ry)**2>1.5).map(t=>({...t,s:.8+rnd()*.6,c:rnd()*4|0,gc:rnd()<.15?['#4da3ff','#4dffb0','#b07cff'][rnd()*3|0]:null}));
trees.forEach(t=>block(t.x,t.y,14*t.s));
const rocks=scatter(24,(x,y,a)=>far(x,y,100)&&!isBlocked(x,y)&&apart(a,x,y,70));rocks.forEach(r=>block(r.x,r.y,16));
const mush=scatter(45,(x,y,a)=>far(x,y,70)&&!isBlocked(x,y)&&apart(a,x,y,60)).map(m=>({...m,c:['#4da3ff','#4dffb0','#b07cff'][rnd()*3|0]}));
let berries=scatter(36,(x,y,a)=>far(x,y,70)&&!isBlocked(x,y)&&apart(a,x,y,50)&&apart(mush,x,y,30));

/* ============ A* on the grid ============ */
function astar(sx,sy,ex,ey){
 const n=GW*GH,g=new Float32Array(n).fill(1e9),f=new Float32Array(n),from=new Int32Array(n).fill(-1),closed=new Uint8Array(n);
 const s=sy*GW+sx,e=ey*GW+ex,h=i=>{const dx=Math.abs(i%GW-ex),dy=Math.abs((i/GW|0)-ey);return dx+dy-.586*Math.min(dx,dy)};
 g[s]=0;f[s]=h(s);const open=[s];
 while(open.length){
  let bi=0;for(let k=1;k<open.length;k++)if(f[open[k]]<f[open[bi]])bi=k;
  const cur=open.splice(bi,1)[0];
  if(cur===e){const p=[];for(let i=e;i!==-1;i=from[i])p.push([(i%GW+.5)*C,((i/GW|0)+.5)*C]);return p.reverse()}
  closed[cur]=1;const cx=cur%GW,cy=cur/GW|0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
   if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
   const ni=ny*GW+nx;if(blocked[ni]||closed[ni])continue;
   if(dx&&dy&&(blocked[cy*GW+nx]||blocked[ny*GW+cx]))continue; // no corner cutting
   const t=g[cur]+(dx&&dy?1.414:1);
   if(t<g[ni]){g[ni]=t;from[ni]=cur;f[ni]=t+h(ni);if(!open.includes(ni))open.push(ni)}}}
 return null}
function nearFree(x,y){
 const cx=Math.min(GW-1,Math.max(0,x/C|0)),cy=Math.min(GH-1,Math.max(0,y/C|0));
 for(let r=0;r<9;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
  if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const nx=cx+dx,ny=cy+dy;
  if(nx>=0&&ny>=0&&nx<GW&&ny<GH&&!blocked[ny*GW+nx])return[nx,ny]}
 return null}
const simplify=p=>{if(p.length<3)return p;const o=[p[0]];for(let i=1;i<p.length-1;i++){const a=p[i-1],b=p[i],c=p[i+1];if((b[0]-a[0])*(c[1]-b[1])!==(b[1]-a[1])*(c[0]-b[0]))o.push(b)}o.push(p[p.length-1]);return o};

/* ============ state ============ */
const fox={x:spawn.x,y:spawn.y,dir:1,walk:0,sc:1,mode:'idle',t:0,target:''};
const cam={x:0,y:0},queue=[];let got=0,VW,VH,DPR,T=0,sparks=[];
const R=CONFIG.range,range=()=>Math.min(R.cap,R.base+R.step*got);
function resize(){DPR=Math.min(devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

function planTo(x,y){
 const a=queue.length?queue[queue.length-1]:fox,s=nearFree(a.x,a.y),e=nearFree(x,y);if(!s||!e)return false;
 let p=astar(s[0],s[1],e[0],e[1]);if(!p)return false;p.shift();p=simplify(p);
 if(!isBlocked(x,y)){if(p.length)p[p.length-1]=[x,y];else p.push([x,y])}
 p.forEach(q=>queue.push({x:q[0],y:q[1]}));return true}
let toastT;
function say(m,ms=3200){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,ms)}
function tap(sx,sy){
 if(fox.mode==='enter'||fox.mode==='out')return;
 let tx=Math.min(W.w-20,Math.max(20,sx+cam.x)),ty=Math.min(W.h-20,Math.max(20,sy+cam.y));
 const o=queue.length?queue[queue.length-1]:fox,d=Math.hypot(tx-o.x,ty-o.y),rg=range();
 if(d>rg){tx=o.x+(tx-o.x)*rg/d;ty=o.y+(ty-o.y)*rg/d;say('Out of range. Collect berries to reach further.')}
 if(!planTo(tx,ty))say('No way through there.')}
cv.addEventListener('pointerdown',e=>{if(e.button===2)return;$('#pop').hidden=true;tap(e.clientX,e.clientY)});
cv.addEventListener('contextmenu',e=>{e.preventDefault();queue.length=0});
addEventListener('keydown',e=>{if(e.key==='Escape'){queue.length=0;$('#pop').hidden=true;$('#home').hidden=true}});

/* ============ ground bake (faceted mosaic) ============ */
const ground=(()=>{
 const g=document.createElement('canvas');g.width=W.w;g.height=W.h;const x=g.getContext('2d'),r=rng(3),S=80,pt=[];
 for(let j=0;j<=W.h/S+1;j++){pt[j]=[];for(let i=0;i<=W.w/S+1;i++)pt[j][i]=[i*S+(r()-.5)*S*.7,j*S+(r()-.5)*S*.7]}
 for(let j=0;j<W.h/S+1;j++)for(let i=0;i<W.w/S+1;i++){
  const a=pt[j][i],b=pt[j][i+1],c=pt[j+1][i],d=pt[j+1][i+1];
  [[a,b,c],[b,d,c]].forEach(t=>P(t,sh(pal.ground[r()*4|0],.75+r()*.5),x))}
 const pc=['#1d5a6e','#2a7487','#154457','#3a8a95'];
 for(let k=0;k<20;k++){const a1=k/20*6.283,a2=(k+1)/20*6.283;P([[pond.x,pond.y],[pond.x+Math.cos(a1)*pond.rx,pond.y+Math.sin(a1)*pond.ry],[pond.x+Math.cos(a2)*pond.rx,pond.y+Math.sin(a2)*pond.ry]],pc[k%4],x)}
 return g})();

/* ============ sprites (SWAP SPRITE: replace these draw functions with your own art) ============ */
const shadow=(x,y,rx)=>{ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,rx,rx*.28,0,0,7);ctx.fill()};
function drawTree(t){ // SWAP SPRITE: tree
 ctx.save();ctx.translate(t.x-cam.x,t.y-cam.y);ctx.scale(t.s,t.s);shadow(0,2,26);
 P([[-5,0],[5,0],[4,-26],[-4,-26]],'#2b1d1a');P([[0,0],[5,0],[4,-26],[0,-26]],'#1b1210');
 const c=pal.foliage[t.c];
 for(let k=0;k<3;k++){const y0=-22-k*28,w=44-k*8;
  P([[0,y0-48],[-w,y0],[0,y0]],sh(c,1.2-k*.05));P([[0,y0-48],[w,y0],[0,y0]],sh(c,.68));P([[-w,y0],[0,y0],[-w*.3,y0+8]],sh(c,.5));
  if(season==='winter')P([[0,y0-48],[-w*.3,y0-31],[w*.3,y0-31]],'#e8f0f6')}
 ctx.restore()}
function drawRock(r){ctx.save();ctx.translate(r.x-cam.x,r.y-cam.y);shadow(0,2,22);
 P([[-18,0],[-14,-14],[0,-20]],'#6f8590');P([[0,-20],[16,-12],[20,0],[-18,0]],'#44596a');P([[-14,-14],[0,-20],[16,-12],[0,-8]],'#8aa0aa');ctx.restore()}
function drawMush(m){ctx.save();ctx.translate(m.x-cam.x,m.y-cam.y);
 P([[-3,0],[3,0],[2,-8],[-2,-8]],'#e8dcc0');P([[-10,-7],[0,-18],[0,-7]],sh(m.c,1));P([[0,-18],[10,-7],[0,-7]],sh(m.c,.6));ctx.restore()}
function drawBerry(b){const y=Math.sin(T*2+b.x)*2;ctx.save();ctx.translate(b.x-cam.x,b.y-cam.y+y);
 P([[0,-9],[-6,-3],[0,3]],'#ff6a7e');P([[0,-9],[6,-3],[0,3]],'#c2304a');P([[0,-9],[-4,-12],[3,-11]],'#4da37a');ctx.restore()}
function drawBurrow(b){ // SWAP SPRITE: burrow
 const s=b.home?1.3:1;ctx.save();ctx.translate(b.x-cam.x,b.y-cam.y);ctx.scale(s,s);shadow(0,4,62);
 P([[-52,0],[-36,-26],[-10,-38]],'#c9913a');P([[-10,-38],[18,-34],[0,0],[-52,0]],'#8f5f2a');P([[18,-34],[44,-22],[56,0],[0,0]],'#5e3d1c');P([[-36,-26],[-10,-38],[-14,-14]],'#e0b25a');
 P([[-18,0],[-14,-16],[0,-22],[14,-16],[18,0]],'#0a0806');
 P([[-66,0],[-62,0],[-62,-48],[-66,-48]],'#3a2a1c');P([[-72,-48],[-56,-48],[-58,-64],[-70,-64]],b.color);P([[-70,-64],[-58,-64],[-64,-70]],'#2a1c14');
 ctx.font='bold 13px Georgia,serif';ctx.textAlign='center';const w=ctx.measureText(b.title).width+16;
 P([[-w/2,-84],[w/2,-84],[w/2-5,-62],[-w/2+5,-62]],'#2a1c14');ctx.fillStyle='#f1e6c8';ctx.fillText(b.title,0,-68);
 ctx.restore()}
function deco(t,x,y){ctx.save();ctx.translate(x-cam.x,y-cam.y);
 if(t==='pumpkin'){P([[-9,0],[-10,-8],[-4,-13],[0,-13],[0,0]],'#f08a2a');P([[0,-13],[4,-13],[10,-8],[9,0],[0,0]],'#b8541a');P([[-1,-13],[1,-13],[2,-18],[0,-18]],'#4da37a')}
 else if(t==='gift'){P([[-8,0],[-8,-12],[8,-12],[8,0]],'#c93a3a');P([[-1.5,0],[-1.5,-12],[1.5,-12],[1.5,0]],'#f2d48a');P([[-8,-7],[8,-7],[8,-5],[-8,-5]],'#f2d48a')}
 else if(t==='heart'){P([[0,0],[-9,-8],[-6,-14],[0,-10]],'#e0506a');P([[0,0],[9,-8],[6,-14],[0,-10]],'#a8283e')}
 else if(t==='star'){P([[0,-18],[3,-9],[0,0],[-3,-9]],'#f2d48a');P([[-9,-9],[0,-12],[9,-9],[0,-6]],'#d8b04a')}
 else if(t==='clover'){[[-5,-6],[5,-6],[0,-12]].forEach(p=>P([[p[0],p[1]-5],[p[0]+5,p[1]],[p[0],p[1]+5],[p[0]-5,p[1]]],'#2f9a5a'))}
 else if(t==='egg'){P([[0,-16],[-6,-8],[-5,0],[5,0],[6,-8]],'#e6a8e8');P([[-6,-8],[6,-8],[5,-5],[-5,-5]],'#8fd0e8')}
 else if(t==='flag'){P([[-1,0],[1,0],[1,-22],[-1,-22]],'#cfd8dc');P([[1,-22],[14,-19],[1,-14]],'#c93a2a');P([[1,-14],[14,-19],[14,-11],[1,-8]],'#2a5fa8')}
 ctx.restore()}
function drawFox(){ // SWAP SPRITE: fox
 const mv=queue.length>0&&fox.mode==='idle',b=Math.sin(fox.walk)*(mv?1.8:.6),lg=mv?Math.sin(fox.walk)*5:0;
 ctx.save();ctx.translate(fox.x-cam.x,fox.y-cam.y);ctx.scale(fox.dir*fox.sc,fox.sc);shadow(0,2,22);
 P([[-14,-16+b],[-34,-28+b],[-42,-12+b],[-22,-6]],'#d9531e');P([[-34,-28+b],[-42,-12+b],[-37,-20+b]],'#f5ead0');
 P([[-10,-12],[-4,-12],[-4+lg,0],[-10+lg,0]],'#2a1a1a');
 P([[-16,-18+b],[-4,-26+b],[12,-24+b],[14,-12],[-12,-10]],'#e8652a');P([[-4,-26+b],[12,-24+b],[8,-17+b]],'#f2a03a');P([[-12,-10],[14,-12],[8,-15],[-8,-14]],'#f5ead0');
 P([[8,-12],[14,-12],[14-lg,0],[8-lg,0]],'#2a1a1a');
 P([[8,-26+b],[22,-31+b],[34,-22+b],[22,-16+b],[10,-18+b]],'#f08a32');P([[22,-31+b],[34,-22+b],[26,-24+b]],'#f2c36a');P([[22,-16+b],[34,-22+b],[26,-14+b]],'#f5ead0');P([[32,-23+b],[36,-22+b],[33,-20+b]],'#1a1010');
 P([[11,-27+b],[12,-41+b],[19,-30+b]],'#d9531e');P([[19,-30+b],[23,-43+b],[27,-29+b]],'#f08a32');P([[12,-41+b],[14,-37+b],[11,-35+b]],'#1a1010');
 ctx.fillStyle='#1a1010';ctx.fillRect(24,-26+b,2.5,2.5);
 if(hol)P([[7,-24+b],[17,-22+b],[16,-17+b],[8,-18+b]],hol.c);
 const f=Math.sin(T*18)*2;P([[24,-20],[27,-20],[29,-40],[26,-40]],'#5a3a1c');
 P([[22,-40],[27.5,-58-f],[33,-40],[27.5,-35]],'#e0731e');P([[25,-40],[27.5,-51-f],[30,-40],[27.5,-37]],'#ffd86a');
 ctx.restore()}

/* ============ particles ============ */
const parts=RM?[]:Array.from({length:season==='summer'?40:70},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:20+Math.random()*30,ph:Math.random()*9,c:Math.random()*3|0}));
const LEAF=['#e0731e','#c8571f','#d8b04a'];
function drawParts(dark){
 for(const p of parts){
  const x=p.x,y=p.y;
  if(season==='summer'){if(dark)glow(x,y,10,'#c8ff6a',(Math.sin(T*2+p.ph)>0?'cc':'30'))}
  else if(!dark){ctx.save();ctx.translate(x,y);ctx.rotate(T+p.ph);
   if(season==='autumn')P([[0,-5],[3.5,0],[0,5],[-3.5,0]],LEAF[p.c]);
   else if(season==='spring')P([[0,-3],[3,2],[-3,2]],'#f2a0b4');
   else{ctx.fillStyle='#e8f0f6';ctx.fillRect(-1.5,-1.5,3,3)}ctx.restore()}}}
function stepParts(dt){for(const p of parts){p.y+=(season==='summer'?-p.v*.3:p.v)*dt;p.x+=Math.sin(T+p.ph)*20*dt;if(p.y>VH+10)p.y=-10;if(p.y<-10)p.y=VH+10;if(p.x>VW+10)p.x=-10;if(p.x<-10)p.x=VW+10}}

/* ============ UI: popup, home burrow, simple mode ============ */
const O=CONFIG.owner;
const tags=(box,arr)=>arr.forEach(t=>box.append(el('span',t,'tag')));
function showPop(b){
 $('#pt').textContent=b.title;$('#pd').textContent=b.description;const tg=$('#ptags');tg.replaceChildren();tags(tg,b.tech||[]);
 const gh=$('#gh'),u=safe(b.repoUrl);gh.hidden=!u;if(u)gh.href=u;$('#pfb').hidden=true;
 $('#enter').onclick=()=>{$('#pop').hidden=true;fox.mode='enter';fox.t=0;fox.target=safe(b.liveUrl)||safe(b.repoUrl)};
 $('#pop').hidden=false;$('#enter').focus()}
$('#px').onclick=()=>$('#pop').hidden=true;
function openUrl(u){
 if(!u)return;
 // window.open(...,'noopener') always returns null, so we detect blocking first, then sever the opener.
 const w=window.open(u,'_blank');
 if(w){w.opener=null}else{$('#pfl').href=u;$('#pfb').hidden=false;$('#pop').hidden=false}}
let filterTech='',filterQ='';
function renderCards(){
 const g=$('#grid');g.replaceChildren();
 CONFIG.projects.filter(p=>(!filterTech||p.tech.includes(filterTech))&&(p.title+p.description+p.tech.join(' ')).toLowerCase().includes(filterQ)).forEach(p=>{
  const c=el('div',null,'panel');c.append(el('h2',p.title),el('small',p.status||''),el('p',p.description));tags(c,p.tech);
  const r=el('div',null,'row'),ft=el('button','Fast travel');
  ft.onclick=()=>{$('#home').hidden=true;queue.length=0;const b=burrows.find(x=>x.id===p.id);planTo(b.x,b.y+60)};
  r.append(ft);const u=safe(p.repoUrl);if(u){const a=el('a','GitHub','btn alt');a.href=u;a.target='_blank';a.rel='noopener noreferrer';r.append(a)}
  c.append(r);g.append(c)});
 if(!g.children.length)g.append(el('p','No projects match. Clear the search or pick another technology.'))}
function buildHome(){
 $('#hn').textContent=O.name;$('#hr').textContent=O.role;$('#hb').textContent=O.bio;
 [['GitHub',safe(O.github)],['LinkedIn',safe(O.linkedin)],['Email',/^mailto:[^\s]+$/.test(O.email)?O.email:'']].forEach(([n,u])=>{if(!u)return;const a=el('a',n,'btn');a.href=u;if(u[0]==='h'){a.target='_blank';a.rel='noopener noreferrer'}$('#hl').append(a)});
 const ch=$('#chips');['All',...new Set(CONFIG.projects.flatMap(p=>p.tech))].forEach(t=>{const b=el('button',t,'alt');b.style.marginRight='6px';b.onclick=()=>{filterTech=t==='All'?'':t;renderCards()};ch.append(b)});
 $('#q').oninput=e=>{filterQ=e.target.value.toLowerCase();renderCards()};renderCards();
 CONFIG.projects.forEach(p=>{const li=el('li');li.append(el('b',p.title),el('br'),el('span',p.description+' ('+p.tech.join(', ')+') '));const u=safe(p.repoUrl);if(u){const a=el('a','Repository');a.href=u;li.append(a)}$('#sl').append(li)})}
$('#hx').onclick=()=>$('#home').hidden=true;
const openHome=()=>{$('#home').hidden=false;$('#q').focus()};
$('#sm').onclick=()=>document.body.classList.add('simple');$('#sb').onclick=()=>document.body.classList.remove('simple');
if(new URLSearchParams(location.search).has('simple'))document.body.classList.add('simple');
buildHome();
$('#ss').textContent=season[0].toUpperCase()+season.slice(1)+(hol?' · '+hol.n+(best>0?' in '+best+'d':''):'');

/* ============ audio (Web Audio, muted until toggled) ============ */
let au,mg,soundOn=false;
$('#snd').onclick=()=>{
 if(!au){au=new AudioContext();mg=au.createGain();mg.connect(au.destination);
  const buf=au.createBuffer(1,au.sampleRate*2,au.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const wind=au.createBufferSource();wind.buffer=buf;wind.loop=true;const f=au.createBiquadFilter();f.frequency.value=380;const wg=au.createGain();wg.gain.value=.05;wind.connect(f).connect(wg).connect(mg);wind.start();
  const cr=au.createOscillator();cr.frequency.value=4300;const cg=au.createGain();cg.gain.value=0;const l=au.createOscillator();l.type='square';l.frequency.value=8;const lg=au.createGain();lg.gain.value=.005;l.connect(lg).connect(cg.gain);cr.connect(cg).connect(mg);cr.start();l.start();
  [196,246.9,293.7].forEach(fr=>{const o=au.createOscillator(),g=au.createGain();o.frequency.value=fr;g.gain.value=.012;o.connect(g).connect(mg);o.start()})}
 soundOn=!soundOn;au.resume();mg.gain.value=soundOn?.8:0;$('#snd').textContent='Sound: '+(soundOn?'on':'off');$('#snd').setAttribute('aria-pressed',soundOn)};

/* ============ main loop ============ */
function arrive(){const b=burrows.find(b=>Math.hypot(b.x-fox.x,b.y-fox.y)<CONFIG.interact);if(b)b.home?openHome():showPop(b)}
function update(dt){
 if(fox.mode==='enter'){fox.t+=dt;fox.sc=Math.max(0,1-fox.t/.9);if(fox.t>=.9){openUrl(fox.target);fox.mode='out';fox.t=0}}
 else if(fox.mode==='out'){fox.t+=dt;fox.sc=Math.min(1,fox.t/.6);if(fox.sc>=1)fox.mode='idle'}
 else if(queue.length){
  const q=queue[0],dx=q.x-fox.x,dy=q.y-fox.y,d=Math.hypot(dx,dy),st=CONFIG.speed*dt;
  if(d<=st){fox.x=q.x;fox.y=q.y;queue.shift();if(!queue.length)arrive()}
  else{fox.x+=dx/d*st;fox.y+=dy/d*st;if(Math.abs(dx)>1)fox.dir=dx>0?1:-1;fox.walk+=dt*12}}
 else fox.walk+=dt*2;
 for(let i=berries.length-1;i>=0;i--)if(Math.hypot(berries[i].x-fox.x,berries[i].y-fox.y)<24){
  const b=berries.splice(i,1)[0];got++;for(let k=0;k<10;k++)sparks.push({x:b.x,y:b.y-6,vx:(Math.random()-.5)*120,vy:-Math.random()*100,l:.7});
  $('#nb').textContent=got;$('#lv').textContent=Math.round((range()-R.base)/R.step);$('#bar').style.width=(range()-R.base)/(R.cap-R.base)*100+'%'}
 sparks=sparks.filter(s=>(s.l-=dt)>0);sparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=200*dt});
 const k=RM?1:Math.min(1,dt*4);cam.x+=(fox.x-VW/2-cam.x)*k;cam.y+=(fox.y-VH/2-cam.y)*k;
 cam.x=Math.max(0,Math.min(W.w-VW,cam.x));cam.y=Math.max(0,Math.min(W.h-VH,cam.y));stepParts(dt)}
const vis=(o,m=100)=>o.x>cam.x-m&&o.x<cam.x+VW+m&&o.y>cam.y-m&&o.y<cam.y+VH+m+100;
function render(){
 ctx.fillStyle='#050914';ctx.fillRect(0,0,VW,VH);ctx.drawImage(ground,cam.x,cam.y,VW,VH,0,0,VW,VH);
 const it=[[fox.y,drawFox]];
 trees.forEach(t=>vis(t)&&it.push([t.y,()=>drawTree(t)]));rocks.forEach(r=>vis(r)&&it.push([r.y,()=>drawRock(r)]));
 mush.forEach(m=>vis(m)&&it.push([m.y,()=>drawMush(m)]));berries.forEach(b=>vis(b)&&it.push([b.y,()=>drawBerry(b)]));
 burrows.forEach(b=>{if(!vis(b))return;it.push([b.y,()=>drawBurrow(b)]);
  if(hol)[[-85,10],[80,16],[0,44]].forEach(o=>it.push([b.y+o[1],()=>deco(hol.deco,b.x+o[0],b.y+o[1])]))});
 it.sort((a,b)=>a[0]-b[0]).forEach(i=>i[1]());
 drawParts(false);
 /* darkness: radial mask centred on the torch, noise-driven flicker */
 const L=CONFIG.light,fl=(Math.sin(T*7.1)*.5+Math.sin(T*13.7+1)*.3+Math.sin(T*3.3)*.2)*L.flicker*(RM?.3:1);
 const r=L.radius*(1+fl)*(.4+.6*fox.sc),tx=fox.x+fox.dir*27*fox.sc-cam.x,ty=fox.y-46*fox.sc-cam.y;
 const gd=ctx.createRadialGradient(tx,ty,r*.12,tx,ty,r);
 gd.addColorStop(0,'rgba(5,8,18,0)');gd.addColorStop(.55,'rgba(5,8,18,.45)');gd.addColorStop(1,`rgba(5,8,18,${L.darkness})`);
 ctx.fillStyle=gd;ctx.fillRect(0,0,VW,VH);
 /* additive pass: warm torch + bioluminescent glows visible from afar */
 ctx.globalCompositeOperation='lighter';
 glow(tx,ty,r*.9,'#ff9a3c','2e');
 mush.forEach(m=>vis(m)&&glow(m.x-cam.x,m.y-cam.y-8,46,m.c,'66'));
 trees.forEach(t=>t.gc&&vis(t)&&glow(t.x-cam.x,t.y-cam.y-50,64,t.gc,'2a'));
 berries.forEach(b=>vis(b)&&glow(b.x-cam.x,b.y-cam.y-4,20,'#ff4d7a','66'));
 burrows.forEach(b=>vis(b)&&glow(b.x-cam.x-(b.home?80:64),b.y-cam.y-(b.home?44:32),b.home?110:76,b.color,'66'));
 sparks.forEach(s=>glow(s.x-cam.x,s.y-cam.y,8,'#ffe08a','cc'));
 drawParts(true);
 /* path trail + range ring */
 ctx.globalCompositeOperation='source-over';
 const o=queue.length?queue[queue.length-1]:fox;
 ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(240,200,120,.25)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(o.x-cam.x,o.y-cam.y,range(),0,7);ctx.stroke();ctx.setLineDash([]);
 if(queue.length){
  ctx.fillStyle='rgba(255,214,140,.7)';let px=fox.x,py=fox.y,rem=24-(T*20)%24;
  for(const q of queue){const dx=q.x-px,dy=q.y-py,d=Math.hypot(dx,dy);let pos=rem;
   while(pos<d){ctx.beginPath();ctx.arc(px+dx*pos/d-cam.x,py+dy*pos/d-cam.y,2.4,0,7);ctx.fill();pos+=24}
   rem=pos-d;px=q.x;py=q.y}
  ctx.strokeStyle='rgba(255,214,140,.8)';ctx.beginPath();ctx.arc(px-cam.x,py-cam.y,8+Math.sin(T*4)*2,0,7);ctx.stroke()}
 /* minimap */
 const m=$('#mm').getContext('2d'),sx=140/W.w,sy=105/W.h;m.fillStyle='#0a1220';m.fillRect(0,0,140,105);
 m.fillStyle='#1d5a6e';m.fillRect((pond.x-pond.rx)*sx,(pond.y-pond.ry)*sy,pond.rx*2*sx,pond.ry*2*sy);
 burrows.forEach(b=>{m.fillStyle=b.color;m.fillRect(b.x*sx-2,b.y*sy-2,4,4)});
 m.strokeStyle='#f2d48a';m.strokeRect(cam.x*sx,cam.y*sy,VW*sx,VH*sy);m.fillStyle='#e0731e';m.fillRect(fox.x*sx-2,fox.y*sy-2,5,5)}
let last=0;
function loop(ms){const dt=Math.min(.05,(ms-last)/1000||0);last=ms;T+=dt;if(!document.body.classList.contains('simple')){update(dt);render()}requestAnimationFrame(loop)}
cam.x=Math.max(0,fox.x-VW/2);cam.y=Math.max(0,fox.y-VH/2);
requestAnimationFrame(loop);
setTimeout(()=>{$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),600);say('Click to move. Chain clicks to plan a path.',7000)},700);
</script>
</body></html>
